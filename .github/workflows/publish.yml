name: publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BOOKCLUB_TZ: ${{ vars.BOOKCLUB_TZ }}
  BOOKCLUB_JOIN_URL: ${{ vars.BOOKCLUB_JOIN_URL }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
      - run: uv run bookclub build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
      # Only the scheduled run posts, so pushes and manual runs never double-announce.
      - if: github.event_name == 'schedule'
        run: uv run bookclub slack --site-url "${{ vars.SITE_URL }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
